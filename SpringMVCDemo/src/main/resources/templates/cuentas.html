<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cuentas</title>
</head>
<body>
<h1>Bienvenido a la sección Cuentas</h1>
<h2>Listado de cuentas</h2>
<table>
    <tr>
        <th>Id</th>
        <th>Saldo</th>
    </tr>
    <tr th:each="cuenta : ${cuentas}">
        <td th:text="${cuenta.numCuenta}">id de cuenta</td>
        <td th:text="${cuenta.saldo}">saldo de cuenta</td>
        <td><a th:href="@{'/cuenta/' + ${cuenta.userId} + '/' + ${cuenta.numCuenta}">Ver detalles</a></td>
        <td><a th:href="@{'/cuenta/' + ${cuenta.userId} + '/' + ${cuenta.numCuenta} + '/borrar'">Borrar</a></td>
    </tr>
<h2>Crear cuenta</h2>
<form th:action="@{/cuentas}" method="post">
    <label for="saldo">Saldo:</label>
    <input type="number" id="saldo" name="saldo" required>
    <br>
    <button type="submit">Crear</button>
</form>
</body>
</html>
